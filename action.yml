name: Policy Alias Marker
description: Inert marker used only for an owned repository policy validation
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [ -z "$POLICY_ALIAS_SENTINEL" ]; then
          echo "CANARY_PRESENT=false"
          exit 1
        fi
        echo "CANARY_PRESENT=true"
        echo "POLICY_ALIAS_MARKER=POST_TRANSFER_EXTERNAL_SECRET_CANARY"
