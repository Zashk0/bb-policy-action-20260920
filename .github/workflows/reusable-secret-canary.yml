name: External reusable secret canary

on:
  workflow_call:
    secrets:
      sentinel:
        required: true

jobs:
  verify-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Verify inherited canary without revealing it
        shell: bash
        env:
          SENTINEL: ${{ secrets.sentinel }}
        run: |
          actual="$(printf '%s' "$SENTINEL" | sha256sum | cut -d' ' -f1)"
          if [ "$actual" != "97e428fba41f3d88a2ad2dc1f6e0f92563ab8bb7097498fe062a8cc20211a368" ]; then
            echo "CANARY_HASH_MATCH=false"
            exit 1
          fi
          echo "CANARY_HASH_MATCH=true"
